[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "munit-generation-agent"
version = "1.0.0"
description = "MuleSoft MUnit Generation Agent - Generate MUnit test suites from Mule XML and business use cases"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "MUnit Generation Agent", email = "agent@example.com"}
]
keywords = ["mulesoft", "munit", "testing", "xml", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "litellm==1.45.0",
    "PyGithub>=2.3.0",
    "atlassian-python-api>=3.41.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "lxml>=5.2.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tenacity>=8.4.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/example/munit-generation-agent"
Repository = "https://github.com/example/munit-generation-agent.git"
Issues = "https://github.com/example/munit-generation-agent/issues"

[project.scripts]
munit-agent = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "inputs*", "llm*", "output*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
